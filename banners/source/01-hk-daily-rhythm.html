<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>港式日常 好有節奏</title>
  <link rel="stylesheet" href="banner.css" />
</head>
<body>
  <main class="banner banner-01">
    <div class="tile-float"></div>
    <div class="noise"></div>
    <div class="grain-lines"></div>
    <div class="corner-no">HK / 01</div>
    <div class="floating-word">CHA CHAAN TENG</div>

    <section class="copy">
      <div class="eyebrow"><span class="dot"></span> Hong Kong · Cha Chaan Teng</div>
      <h1>
        <span class="line">港式日常</span>
        <span class="line accent">好有節奏</span>
      </h1>
      <div class="subline"><span class="rule"></span> From Hong Kong to the world</div>
      <div class="chips">
        <span class="chip">Milk Tea</span>
        <span class="chip">Pineapple Bun</span>
        <span class="chip">All-day Energy</span>
      </div>
    </section>

    <div class="stamp"><strong>茶記</strong>HONG KONG<br />SINCE 1950s</div>

    <div class="art">
      <svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" aria-label="Milk tea, pineapple bun and noodles illustration">
        <defs>
          <clipPath id="discClip1"><circle cx="428" cy="272" r="238" /></clipPath>
          <linearGradient id="cupCream" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fffdf4" />
            <stop offset="1" stop-color="#e8dbca" />
          </linearGradient>
          <linearGradient id="teaBrown" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b76f38" />
            <stop offset="1" stop-color="#6f351b" />
          </linearGradient>
          <linearGradient id="bunGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd871" />
            <stop offset=".6" stop-color="#e9a33b" />
            <stop offset="1" stop-color="#bd641f" />
          </linearGradient>
          <linearGradient id="bowlTeal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2cb6a1" />
            <stop offset="1" stop-color="#087965" />
          </linearGradient>
          <filter id="shadow1" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="9" dy="16" stdDeviation="3" flood-color="#1a1715" flood-opacity=".38" />
          </filter>
          <filter id="softShadow1" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#1a1715" flood-opacity=".23" />
          </filter>
        </defs>

        <circle cx="428" cy="272" r="238" fill="#fff9e9" stroke="#1a1715" stroke-width="7" filter="url(#softShadow1)" />
        <g clip-path="url(#discClip1)" opacity=".32">
          <g fill="#ff5b21">
            <circle cx="280" cy="95" r="8"/><circle cx="315" cy="95" r="8"/><circle cx="350" cy="95" r="8"/><circle cx="385" cy="95" r="8"/><circle cx="420" cy="95" r="8"/><circle cx="455" cy="95" r="8"/><circle cx="490" cy="95" r="8"/><circle cx="525" cy="95" r="8"/><circle cx="560" cy="95" r="8"/>
            <circle cx="262" cy="130" r="8"/><circle cx="297" cy="130" r="8"/><circle cx="332" cy="130" r="8"/><circle cx="367" cy="130" r="8"/><circle cx="402" cy="130" r="8"/><circle cx="437" cy="130" r="8"/><circle cx="472" cy="130" r="8"/><circle cx="507" cy="130" r="8"/><circle cx="542" cy="130" r="8"/><circle cx="577" cy="130" r="8"/>
          </g>
        </g>

        <!-- pineapple bun -->
        <g filter="url(#shadow1)" transform="rotate(7 540 390)">
          <path d="M391 388c12-82 71-119 147-113 81 6 129 55 125 126-3 70-57 102-137 99-82-3-146-38-135-112z" fill="url(#bunGold)" stroke="#1a1715" stroke-width="7" />

          <ellipse cx="487" cy="320" rx="34" ry="17" fill="#ffe995" opacity=".58" transform="rotate(-20 487 320)" />
        </g>

        <g filter="url(#shadow1)">
          <path d="M229 150h236l-24 210c-4 32-29 54-61 54h-67c-33 0-59-23-63-55z" fill="url(#cupCream)" stroke="#1a1715" stroke-width="7" />
          <ellipse cx="347" cy="150" rx="118" ry="35" fill="url(#teaBrown)" stroke="#1a1715" stroke-width="7" />
          <ellipse cx="347" cy="150" rx="94" ry="22" fill="#d79b5a" opacity=".48" />
          <path d="M280 147c20-12 59-18 101-12" fill="none" stroke="#f8d8a8" stroke-width="8" stroke-linecap="round" opacity=".55" />
          <path d="M348 126l64-104" stroke="#1a1715" stroke-width="20" stroke-linecap="round" />
          <path d="M348 126l64-104" stroke="#ffca3a" stroke-width="11" stroke-linecap="round" />
          <path d="M250 195c42 20 146 22 193 0" fill="none" stroke="#1a1715" stroke-width="4" opacity=".2" />
          <circle cx="292" cy="346" r="13" fill="#4b2417" stroke="#1a1715" stroke-width="4" />
          <circle cx="329" cy="365" r="14" fill="#4b2417" stroke="#1a1715" stroke-width="4" />
          <circle cx="366" cy="354" r="13" fill="#4b2417" stroke="#1a1715" stroke-width="4" />
          <circle cx="397" cy="374" r="14" fill="#4b2417" stroke="#1a1715" stroke-width="4" />
          <circle cx="345" cy="389" r="13" fill="#4b2417" stroke="#1a1715" stroke-width="4" />
          <path d="M271 224c13 42 23 83 25 124" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".45" />
        </g>

        <!-- noodle bowl -->
        <g filter="url(#shadow1)">
          <path d="M97 384c18 90 78 134 159 134 83 0 145-45 164-134z" fill="url(#bowlTeal)" stroke="#1a1715" stroke-width="7" />
          <ellipse cx="258" cy="384" rx="162" ry="45" fill="#fff9e9" stroke="#1a1715" stroke-width="7" />
          <ellipse cx="258" cy="383" rx="140" ry="33" fill="#e8a440" />

        </g>

        <!-- sparkles -->
        <path d="M124 123l8 25 25 8-25 8-8 25-8-25-25-8 25-8z" fill="#fff9e9" stroke="#1a1715" stroke-width="4" />
        <path d="M635 126l6 21 21 6-21 6-6 21-6-21-21-6 21-6z" fill="#ff5b21" stroke="#1a1715" stroke-width="4" />
        <path d="M687 211l4 16 16 4-16 4-4 16-4-16-16-4 16-4z" fill="#fff9e9" />
        <path d="M688 58l4 15 15 4-15 4-4 15-4-15-15-4 15-4z" fill="#fff9e9" />
      </svg>
    </div>

    <div class="side-label">MILK TEA · PINEAPPLE BUN · NOODLES · ALL DAY</div>
    <div class="noise"></div>
  </main>
</body>
</html>
