<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      const entry = new URLSearchParams(location.search);
      const opensMenu = ['table', 'store'].includes(entry.get('code')) || ['fees', 'postpay'].includes(entry.get('demo'));
      const trialReload = entry.get('code') === 'table' && entry.get('trial') === '1'
        && performance.getEntriesByType('navigation')[0]?.type === 'reload';
      const opensTrial = trialReload || (!entry.has('code') && !entry.has('demo'));
      const images = opensTrial ? [] : opensMenu
        ? [
            '/table-ordering-demo/assets/hong-kong-cafe-banner-optimized.webp',
            '/table-ordering-demo/dish-thumbnails/baked-pork-rice.webp',
            '/table-ordering-demo/dish-thumbnails/char-siu-egg-rice.webp',
          ]
        : ['/table-ordering-demo/assets/welcome-hero-optimized.webp'];
      images.forEach((src, index) => {
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        if (index === 0) preload.setAttribute('fetchpriority', 'high');
        preload.href = src;
        document.head.append(preload);
      });
    </script>
    <title>Figma Make App</title>
    
    <meta name="description" content="Helps users design polished, internationally appealing interfaces by combining the features and workflows of one reference with the visual style of another.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/table-ordering-demo/favicon.png">
    <meta property="og:title" content="Figma Make App">
    <meta property="og:description" content="Helps users design polished, internationally appealing interfaces by combining the features and workflows of one reference with the visual style of another.">
    <script type="module" crossorigin src="/table-ordering-demo/assets/index-if9zkZLz.js"></script>
    <link rel="stylesheet" crossorigin href="/table-ordering-demo/assets/index-BGO2ZoPv.css">
  </head>
  <body>
    
    <div id="root"></div>
    
  </body>
</html>
