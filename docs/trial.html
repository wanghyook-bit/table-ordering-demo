<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫码点餐试用</title>
  <style>:root{--color-action:#b84a13;--color-brand-soft:#fff1e7}body{margin:0;background:#f5f3f1;font-family:'PingFang HK','PingFang SC','PingFang TC','Hiragino Sans GB',ui-sans-serif,system-ui,sans-serif;color:#1d2028}main{box-sizing:border-box;max-width:390px;min-height:100dvh;margin:auto;padding:48px 24px;background:white}h1{font-size:24px}p{color:#636671;line-height:1.6}.option{display:block;margin-top:14px;padding:18px;border:1px solid #eae6e3;border-radius:16px;color:inherit;text-decoration:none}.option strong{display:block;font-size:18px}.option span{display:block;margin-top:6px;color:#727580;font-size:14px}.note{font-size:13px;margin-top:24px}.resume{display:block;margin-top:12px;color:var(--color-action);font-size:14px}.resume[hidden]{display:none}.option:active{background:var(--color-brand-soft);border-color:var(--color-action)}a:focus-visible{outline:2px solid var(--color-action);outline-offset:2px}
    .menu-settings{margin:24px 0}
    .menu-settings h2{margin:0 0 16px;font-size:18px}
    .menu-settings fieldset{min-width:0;margin:0;padding:0;border:0}
    .menu-settings fieldset + fieldset{margin-top:16px}
    .menu-settings legend{margin-bottom:8px;padding:0;font-size:14px;font-weight:600}
    .display-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .category-choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .display-choice{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:8px;min-width:0;min-height:42px;padding:6px;border:1px solid #eae6e3;border-radius:12px;cursor:pointer}
    .display-choice:has(:checked){border-color:var(--color-action);background:var(--color-brand-soft)}
    .display-choice:has(:focus-visible){outline:2px solid var(--color-action);outline-offset:2px}
    .choice-label{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
    .choice-label input{flex:none;width:14px;height:14px;margin:0;accent-color:var(--color-action)}
    .category-choices .display-choice{padding:8px}
    .layout-preview{display:flex;flex-direction:column;align-items:stretch;gap:5px;height:55px;padding:7px;overflow:hidden;border:1px solid #eae6e3;border-radius:8px;background:#fff}
    .layout-preview--vertical{flex-direction:row}
    .layout-tabs{display:flex;gap:3px}
    .layout-preview--vertical .layout-tabs{flex:0 0 21%;flex-direction:column}
    .layout-tabs i{width:18%;height:4px;border-radius:3px;background:#e5dfda}
    .layout-preview--vertical .layout-tabs i{width:100%}
    .layout-tabs i:first-child{background:#ce774a}
    .layout-dishes{display:grid;flex:1;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
    .layout-dishes i{border:1px solid #eee9e6;border-radius:3px;background:#f5f3f1}
    .menu-settings[data-template="list"] .layout-dishes,
    .menu-settings[data-template="large"] .layout-dishes{grid-template-columns:minmax(0,1fr)}
    .menu-settings[data-template="list"] .layout-dishes i{background:linear-gradient(90deg,#e8e3df 23%,#f5f3f1 23%)}
    .menu-settings[data-template="large"] .layout-dishes{grid-auto-rows:26px}
  </style>
</head>
<body><main><h1 id="title"></h1><p id="intro"></p>
  <section class="menu-settings" id="menu-settings" aria-labelledby="menu-settings-title" data-template="grid">
    <h2 id="menu-settings-title" data-copy="menuDisplay"></h2>
    <fieldset>
      <legend data-copy="template"></legend>
      <div class="display-choices">
        <label class="display-choice"><span class="choice-label"><input type="radio" name="menuTemplate" value="list"><span data-copy="list"></span></span></label>
        <label class="display-choice"><span class="choice-label"><input type="radio" name="menuTemplate" value="grid" checked><span data-copy="grid"></span></span></label>
        <label class="display-choice"><span class="choice-label"><input type="radio" name="menuTemplate" value="large"><span data-copy="large"></span></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-copy="categories"></legend>
      <div class="display-choices category-choices">
        <label class="display-choice">
          <span class="layout-preview" aria-hidden="true"><span class="layout-tabs"><i></i><i></i><i></i></span><span class="layout-dishes"><i></i><i></i><i></i><i></i></span></span>
          <span class="choice-label"><input type="radio" name="categoryLayout" value="horizontal" checked><span data-copy="horizontal"></span></span>
        </label>
        <label class="display-choice">
          <span class="layout-preview layout-preview--vertical" aria-hidden="true"><span class="layout-tabs"><i></i><i></i><i></i></span><span class="layout-dishes"><i></i><i></i><i></i><i></i></span></span>
          <span class="choice-label"><input type="radio" name="categoryLayout" value="vertical"><span data-copy="vertical"></span></span>
        </label>
      </div>
    </fieldset>
  </section>
  <a class="option" id="post"><strong id="post-label"></strong><span id="post-desc"></span></a><a class="resume" id="post-resume" hidden></a><a class="option" id="pre"><strong id="pre-label"></strong><span id="pre-desc"></span></a><a class="resume" id="pre-resume" hidden></a><p class="note" id="note"></p></main>
<script>
const code = new URLSearchParams(location.search).get('code') === 'table' ? 'table' : 'store';
const lang = ['en', 'hk', 'zh'].includes(localStorage.getItem('ordering-language')) ? localStorage.getItem('ordering-language') : 'hk';
const texts = {
  en: { menuDisplay: 'Menu display', template: 'Template', list: 'List view', grid: 'Grid view', large: 'Large cards', categories: 'Category layout', horizontal: 'Horizontal', vertical: 'Vertical', table: 'Table ordering trial', store: 'Store ordering trial', intro: 'Choose a payment flow to start a new trial.', post: 'Pay later', postDesc: 'Order first, then pay after acceptance', pre: 'Pay first', preDesc: 'Your order is placed after payment', postResume: 'Continue previous pay-later trial', preResume: 'Continue previous pay-first trial', note: 'This is a prototype. Actual ordering options depend on the restaurant.' },
  hk: { menuDisplay: '菜單展示', template: '模板', list: '列表視圖', grid: '網格視圖', large: '大卡視圖', categories: '分類欄展示', horizontal: '橫版', vertical: '豎版', table: '桌碼點餐試用', store: '門店碼點餐試用', intro: '選擇付款流程，開始新的試用', post: '後付', postDesc: '先提交訂單，接單後付款', pre: '先付', preDesc: '付款成功後正式下單', postResume: '繼續上次後付試用', preResume: '繼續上次先付試用', note: '此頁面僅供原型試用，正式顧客流程由門店設定決定。' },
  zh: { menuDisplay: '菜单展示', template: '模板', list: '列表视图', grid: '网格视图', large: '大卡视图', categories: '分类栏展示', horizontal: '横版', vertical: '竖版', table: '桌码点餐试用', store: '门店码点餐试用', intro: '选择付款流程，开始新的试用', post: '后付', postDesc: '先提交订单，接单后付款', pre: '先付', preDesc: '付款成功后正式下单', postResume: '继续上次后付试用', preResume: '继续上次先付试用', note: '此页面仅供原型试用，正式顾客流程由门店设置决定。' },
};
const text = texts[lang]; document.documentElement.lang = lang === 'hk' ? 'zh-HK' : lang === 'zh' ? 'zh-CN' : 'en';
document.querySelector('#title').textContent = text[code]; document.title = text[code];
for (const [id, value] of Object.entries({ intro: text.intro, 'post-label': text.post, 'post-desc': text.postDesc, 'pre-label': text.pre, 'pre-desc': text.preDesc, 'post-resume': text.postResume, 'pre-resume': text.preResume, note: text.note })) document.getElementById(id).textContent = value;
const settings = document.querySelector('#menu-settings');
for (const label of settings.querySelectorAll('[data-copy]')) label.textContent = text[label.dataset.copy];

const app = new URL('./', location.href);
const base = code === 'table' ? app.pathname + '?code=table&table=A08&settlement=manual&trial=1' : app.pathname + '?code=store&settlement=manual';
function trialLink(mode) {
  const destination = new URL(base, location.origin);
  if (mode === 'pre') destination.searchParams.set('payment', 'prepay');
  const template = settings.querySelector('[name="menuTemplate"]:checked').value;
  const categoryLayout = settings.querySelector('[name="categoryLayout"]:checked').value;
  if (template !== 'grid') destination.searchParams.set('menuTemplate', template);
  if (categoryLayout !== 'horizontal') destination.searchParams.set('categoryLayout', categoryLayout);
  return destination;
}

function updateTrialLinks() {
  settings.dataset.template = settings.querySelector('[name="menuTemplate"]:checked').value;
  for (const mode of ['post', 'pre']) document.getElementById(mode).href = trialLink(mode);
}

settings.addEventListener('change', updateTrialLinks);
updateTrialLinks();

for (const mode of ['post', 'pre']) {
  const key = `table-trial-last:${code}:${mode}`;
  const choice = document.querySelector('#' + mode);
  const trialStore = code === 'table' && mode === 'pre' ? localStorage : sessionStorage;
  const previous = trialStore.getItem(key);
  const resume = document.querySelector('#' + mode + '-resume');
  if (previous) { resume.href = previous; resume.hidden = false; }
  choice.addEventListener('click', event => {
    event.preventDefault();
    const id = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const url = trialLink(mode);
    url.searchParams.set('session', id);
    const destination = url.pathname + url.search;
    trialStore.setItem(key, destination);
    location.href = destination;
  });
}
</script></body></html>
