<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫码点餐试用</title>
  <style>body{margin:0;background:#f5f3f1;font-family:'PingFang HK','PingFang SC','PingFang TC','Hiragino Sans GB',ui-sans-serif,system-ui,sans-serif;color:#1d2028}main{box-sizing:border-box;max-width:390px;min-height:100dvh;margin:auto;padding:48px 24px;background:white}h1{font-size:24px}p{color:#636671;line-height:1.6}.option{display:block;margin-top:14px;padding:18px;border:1px solid #eae6e3;border-radius:16px;color:inherit;text-decoration:none}.option strong{display:block;font-size:18px}.option span{display:block;margin-top:6px;color:#727580;font-size:14px}.note{font-size:13px;margin-top:24px}.resume{display:block;margin-top:12px;color:#8b461d;font-size:14px}.resume[hidden]{display:none}</style>
</head>
<body><main><h1 id="title"></h1><p id="intro"></p><a class="option" id="post"><strong id="post-label"></strong><span id="post-desc"></span></a><a class="resume" id="post-resume" hidden></a><a class="option" id="pre"><strong id="pre-label"></strong><span id="pre-desc"></span></a><a class="resume" id="pre-resume" hidden></a><p class="note" id="note"></p></main>
<script>
const code = new URLSearchParams(location.search).get('code') === 'table' ? 'table' : 'store';
const lang = ['en', 'hk', 'zh'].includes(localStorage.getItem('ordering-language')) ? localStorage.getItem('ordering-language') : 'hk';
const texts = {
  en: { table: 'Table ordering trial', store: 'Store ordering trial', intro: 'Choose a payment flow to start a new trial.', post: 'Pay later', postDesc: 'Order first, then pay after acceptance', pre: 'Pay first', preDesc: 'Your order is placed after payment', postResume: 'Continue previous pay-later trial', preResume: 'Continue previous pay-first trial', note: 'This is a prototype. Actual ordering options depend on the restaurant.' },
  hk: { table: '桌碼點餐試用', store: '門店碼點餐試用', intro: '選擇付款流程，開始新的試用', post: '後付', postDesc: '先提交訂單，接單後付款', pre: '先付', preDesc: '付款成功後正式下單', postResume: '繼續上次後付試用', preResume: '繼續上次先付試用', note: '此頁面僅供原型試用，正式顧客流程由門店設定決定。' },
  zh: { table: '桌码点餐试用', store: '门店码点餐试用', intro: '选择付款流程，开始新的试用', post: '后付', postDesc: '先提交订单，接单后付款', pre: '先付', preDesc: '付款成功后正式下单', postResume: '继续上次后付试用', preResume: '继续上次先付试用', note: '此页面仅供原型试用，正式顾客流程由门店设置决定。' },
};
const text = texts[lang]; document.documentElement.lang = lang === 'hk' ? 'zh-HK' : lang === 'zh' ? 'zh-CN' : 'en';
document.querySelector('#title').textContent = text[code]; document.title = text[code];
for (const [id, value] of Object.entries({ intro: text.intro, 'post-label': text.post, 'post-desc': text.postDesc, 'pre-label': text.pre, 'pre-desc': text.preDesc, 'post-resume': text.postResume, 'pre-resume': text.preResume, note: text.note })) document.getElementById(id).textContent = value;
const app = new URL('./', location.href);
const base = code === 'table' ? app.pathname + '?code=table&table=A08&settlement=manual&trial=1' : app.pathname + '?code=store&settlement=manual';
for (const mode of ['post', 'pre']) {
  const key = `table-trial-last:${code}:${mode}`;
  const suffix = mode === 'pre' ? '&payment=prepay' : '';
  const choice = document.querySelector('#' + mode);
  const trialStore = code === 'table' && mode === 'pre' ? localStorage : sessionStorage;
  const previous = trialStore.getItem(key);
  const resume = document.querySelector('#' + mode + '-resume');
  if (previous) { resume.href = previous; resume.hidden = false; }
  choice.href = base + suffix;
  choice.addEventListener('click', event => {
    event.preventDefault();
    const id = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const destination = base + suffix + '&session=' + encodeURIComponent(id);
    trialStore.setItem(key, destination);
    location.href = destination;
  });
}
</script></body></html>
