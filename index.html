<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      const entry = new URLSearchParams(location.search);
      const opensMenu = ['table', 'store'].includes(entry.get('code')) || ['fees', 'postpay'].includes(entry.get('demo'));
      const trialReload = entry.get('code') === 'table' && entry.get('trial') === '1'
        && performance.getEntriesByType('navigation')[0]?.type === 'reload';
      const opensTrial = trialReload || (!entry.has('code') && !entry.has('demo'));
      const images = opensTrial ? [] : opensMenu
        ? [
            '%BASE_URL%assets/hong-kong-cafe-banner-optimized.webp',
            '%BASE_URL%dish-thumbnails/baked-pork-rice.webp',
            '%BASE_URL%dish-thumbnails/char-siu-egg-rice.webp',
          ]
        : ['%BASE_URL%assets/welcome-hero-optimized.webp'];
      images.forEach((src, index) => {
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        if (index === 0) preload.setAttribute('fetchpriority', 'high');
        preload.href = src;
        document.head.append(preload);
      });
    </script>
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
